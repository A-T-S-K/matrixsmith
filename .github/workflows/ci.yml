name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --shm-size=1g
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - run: npm run release:package
      - name: Review development dependency advisories
        if: always()
        run: npm audit --json > dependency-audit.json
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ github.sha }}
          path: |
            coverage/
            playwright-report/
            test-results/
            dependency-audit.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-${{ github.sha }}
          path: release/
